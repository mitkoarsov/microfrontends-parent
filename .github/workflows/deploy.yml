name: Deploy to GitHub Pages (Parent)

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-parent
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - run: npm ci

      # ✅ Enable + configure Pages automatically
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Build with the repo subpath as base (no env files)
      - run: npm run build -- --base=/microfrontends-parent/

      # SPA fallback for GH Pages
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
